name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    name: Lint y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` respeta el package-lock, incluido el `overrides` que necesita
      # eslint-plugin-jsx-a11y para convivir con ESLint 10.
      - run: npm ci

      - run: npm run lint

      - run: npm run build
